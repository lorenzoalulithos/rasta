<!-- Schermata di avvio: resta finché l'app non ha caricato l'utente (niente schermo vuoto) -->
<div id="duemani-splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #17181C; font-family: system-ui, sans-serif">
    <svg width="88" height="88" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="10" y="26" width="80" height="24" rx="12" fill="#7A5A12" transform="rotate(-14 50 50)" />
        <rect x="10" y="52" width="80" height="24" rx="12" fill="#E8A317" transform="rotate(-14 50 50)" />
    </svg>
    <span style="color: #FFFFFF; font-size: 40px; font-weight: 800; letter-spacing: -0.04em">duemani</span>
    <span class="duemani-splash-bar" style="width: 120px; height: 4px; border-radius: 4px; background: #33363F; overflow: hidden">
        <span style="display: block; width: 40%; height: 100%; border-radius: 4px; background: #E8A317; animation: duemani-splash 1.1s ease-in-out infinite"></span>
    </span>
    <style>
        @keyframes duemani-splash { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
        @media (prefers-reduced-motion: reduce) { .duemani-splash-bar span { animation: none !important; width: 100% !important } }
    </style>
</div>
